name: diag-native
on:
  push:
    branches: [feat/rust-ffi]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.0', channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libblkid-dev
      - run: flutter pub get
      - shell: bash
        run: |
          set +e
          flutter build linux --release --no-pub -v > /tmp/b.txt 2>&1
          grep -nE "error|panicked|failed|Finished|Compiling (flutify|rust_lib|flutter_rust)|rustup|cargo build|Cargokit|toolchain|manifest|No such|not found|warning: unused" /tmp/b.txt | grep -v "mimalloc\|test-" | cut -c1-280 | tail -24 | while IFS= read -r l; do echo "::error::L $l"; done
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.0', channel: stable, cache: true }
      - run: flutter pub get
      - shell: bash
        run: |
          set +e
          flutter build windows --release --no-pub -v > /tmp/w.txt 2>&1
          grep -nE "error|Error|FAILED|cargo|rustup|rust_lib|LNK" /tmp/w.txt | grep -v "dart_build\|_cargokit.cmake" | tail -22 | cut -c1-300 | while IFS= read -r l; do echo "::error::W $l"; done
