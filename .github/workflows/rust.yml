name: Rust core

on:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/flutify_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --locked > /tmp/c.txt 2>&1; rc=$?
          grep -nE "^error|-->|panicked|FAILED|^test result" /tmp/c.txt | cut -c1-240 | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          exit $rc
      - run: cargo clippy --all-targets -- -D warnings
