name: diag-linux
on:
  push:
    branches: [feat/rust-ffi]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libblkid-dev
      - run: flutter pub get
      - shell: bash
        run: |
          set +e
          flutter build linux --release --no-pub > /tmp/b.txt 2>&1
          head -30 /tmp/b.txt | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
