name: diag-temp
on:
  push:
    branches: [feat/md3e-batch3]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/ui/gateway_settings_test.dart test/ui/cache_location_settings_test.dart > /tmp/t.txt 2>&1
          for n in $(grep -n "EXCEPTION CAUGHT" /tmp/t.txt | cut -d: -f1 | head -4); do sed -n "$((n+1)),$((n+7))p" /tmp/t.txt | cut -c1-230 | while IFS= read -r l; do echo "::error::[$n] $l"; done; done
