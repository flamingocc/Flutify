name: diag-temp
on:
  push:
    branches: [feat/md3e-batch3]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/ui/gateway_settings_test.dart test/ui/cache_location_settings_test.dart > /tmp/t.txt 2>&1
          grep -nE "EXCEPTION|Warning:|could not be tapped|offset|hit test|Expected|Actual|Which|overflow|RenderFlex|Found [0-9]+|zero widgets|multiple" /tmp/t.txt | cut -c1-260 | awk '!seen[$0]++' | head -25 | while IFS= read -r l; do echo "::error::$l"; done
